[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mal"
version = "0.1.0"
description = "Malaria Atlas Lab - planning and research tool (not for diagnosis or treatment)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "ml/tests"]
pythonpath = ["src"]
